# Explicit source-build mode. Production compose.yaml never compiles sources.
services:
  api:
    image: lovecloud-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${LOVECLOUD_VERSION:-0.1.0}
        REVISION: ${LOVECLOUD_REVISION:-development}
  frontend:
    image: lovecloud-frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VERSION: ${LOVECLOUD_VERSION:-0.1.0}
        REVISION: ${LOVECLOUD_REVISION:-development}
